<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelab BIPD</title>
    
    <!-- Memuatkan font Inter dari Google Fonts untuk teks yang kemas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Memuatkan Tailwind CSS untuk penggayaan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Latar belakang kelabu gelap yang kemas menyerupai tema 'dark mode' yang elegan */
            background-color: #111827; 
            color: #f3f4f6;
        }
        
        /* Penggayaan untuk kad mesej baharu */
        .message-card {
            background:
                radial-gradient(circle at top, rgba(16, 185, 129, 0.15), transparent 50%),
                linear-gradient(145deg, rgba(17, 24, 39, 0.96), rgba(31, 41, 55, 0.92));
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .nomination-chart {
            height: 188px;
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start pt-12 pb-8 px-4 sm:px-6 lg:px-8">
    
    <main class="w-full max-w-md mx-auto flex flex-col items-center">
        
        <!-- Gambar Logo -->
        <div class="relative w-36 h-28 mb-4 flex items-center justify-center">
            <!-- Menggunakan imej baharu: LOGO-BIPD-BM.png untuk kegunaan Netlify -->
            <img 
                src="logo-kelab-bipd.png" 
                alt="Logo Kelab BIPD" 
                class="relative z-10 w-full h-full object-contain drop-shadow-xl"
                onerror="this.onerror=null; this.src='https://placehold.co/150x150/1f2937/f3f4f6?text=BIPD';"
            >
        </div>

        <!-- Tajuk Halaman / Nama Kelab -->
        <h1 class="text-2xl font-bold text-white mb-2 text-center tracking-tight">
            Kelab BIPD
        </h1>
        
        <!-- Penerangan ringkas -->
        <p class="text-gray-400 text-sm mb-8 text-center px-4">
            Platform rasmi untuk ahli Kelab BIPD.
        </p>

        <section class="message-card w-full mb-6 border border-emerald-500/20 rounded-2xl p-6 sm:p-8 shadow-lg overflow-hidden relative text-center">
            
            <!-- Ikon Status (Tanda Seru / Makluman) -->
            <div class="mx-auto w-16 h-16 bg-emerald-500/10 rounded-full flex items-center justify-center mb-5 border border-emerald-500/20 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>

            <!-- Mesej Utama yang telah dikemaskan -->
            <h2 class="text-xl font-bold text-white mb-3 tracking-wide">Terima Kasih!</h2>
            <p class="text-sm text-gray-300 leading-relaxed px-2">
                Terima kasih atas pencalonan anda.<br>Sesi undian akan dibuka secara rasmi semasa <strong>Mesyuarat Agung</strong> berlangsung.
            </p>

            <div class="mt-8 border-t border-white/10 pt-6">
                <h3 class="text-[11px] font-semibold uppercase tracking-[0.22em] text-emerald-200/70 mb-4">
                    Status Pencalonan Semasa
                </h3>
                <div id="nominationChart" class="nomination-chart" aria-label="Memuatkan statistik pencalonan"></div>
                <p id="participationMessage" class="mt-3 text-center text-xs text-gray-400">
                    Memuatkan statistik pencalonan...
                </p>
            </div>
        </section>

    </main>

    <footer class="mt-auto pt-12 w-full text-center">
        <p class="text-xs text-gray-500">
            &copy; <span id="currentYear"></span> Kelab BIPD. Hak Cipta Terpelihara.
        </p>
    </footer>

    <script>
        // Set tahun semasa secara automatik di footer
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // Pembolehubah untuk sistem Google Sheets dan carta
        const sheetId = '1Dwpdnj7BY6uFCNR70CzQTLEHB0VHJul4SHwtkmXHqpg';
        const sheetName = 'EmailLayak';
        const settingsSheetName = 'Settings';
        const nominationChartElement = document.getElementById('nominationChart');
        const nominationChart = echarts.init(nominationChartElement);
        const participationMessage = document.getElementById('participationMessage');
        let currentSystemPhase = 'nomination';
        let latestParticipationResponse = null;

        // Semak sekiranya sel mempunyai nilai
        function isFilledCell(cell) {
            if (!cell || cell.v === null || cell.v === undefined) return false;
            return String(cell.v).trim() !== '';
        }

        // Dapatkan nilai sel
        function getCellValue(row, index) {
            return row && row.c && row.c[index] ? row.c[index].v : null;
        }

        function renderNominationChart(nominated, notNominated, total) {
            const nominationPct = total ? (nominated / total) * 100 : 0;
            const nominationPctText = nominationPct.toFixed(1);

            nominationChartElement.setAttribute('aria-label', `${nominationPctText}% pencalonan selesai. ${nominated} sudah calon, ${notNominated} belum calon.`);
            nominationChart.setOption({
                backgroundColor: 'transparent',
                color: ['#10b981', 'rgba(255, 255, 255, 0.08)'], // Warna hijau emerald
                title: {
                    text: `${nominationPctText}%`,
                    subtext: 'Pencalonan',
                    left: 'center',
                    top: 'center',
                    textStyle: {
                        color: '#34d399',
                        fontFamily: 'Inter, sans-serif',
                        fontSize: 31,
                        fontWeight: 800,
                        lineHeight: 38
                    },
                    subtextStyle: {
                        color: '#9ca3af',
                        fontFamily: 'Inter, sans-serif',
                        fontSize: 11,
                        fontWeight: 600
                    },
                    itemGap: 2
                },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: '#020617',
                    borderColor: 'rgba(255, 255, 255, 0.12)',
                    borderWidth: 1,
                    textStyle: {
                        color: '#e5e7eb',
                        fontFamily: 'Inter, sans-serif',
                        fontSize: 12
                    },
                    formatter: params => {
                        const percent = total ? ((params.value / total) * 100).toFixed(1) : '0.0';
                        return `<strong>${params.name}</strong><br/>${params.value} ahli (${percent}%)`;
                    }
                },
                series: [
                    {
                        type: 'pie',
                        radius: ['62%', '84%'],
                        center: ['50%', '50%'],
                        avoidLabelOverlap: true,
                        label: { show: false },
                        labelLine: { show: false },
                        emphasis: {
                            scale: true,
                            scaleSize: 4
                        },
                        data: [
                            { name: 'Sudah calon', value: nominated },
                            { name: 'Belum calon', value: notNominated }
                        ]
                    }
                ]
            });
        }

        function getActiveVoteRole(phase) {
            const roleByPhase = {
                voting_pengerusi: { index: 2, label: 'Pengerusi' },
                voting_setiausaha: { index: 3, label: 'Setiausaha' },
                voting_bendahari: { index: 4, label: 'Bendahari' },
                voting_ajk: { index: 5, label: 'AJK' }
            };
            return roleByPhase[phase] || null;
        }

        function updateSystemPhase(response) {
            const rows = response.table.rows || [];
            const phaseRow = rows.find(row => getCellValue(row, 0) === 'Fasa Sistem');
            currentSystemPhase = phaseRow ? getCellValue(phaseRow, 1) || 'nomination' : 'nomination';

            if (latestParticipationResponse) {
                updateParticipationStats(latestParticipationResponse);
            }
        }

        function updateParticipationStats(response) {
            try {
                latestParticipationResponse = response;
                const rows = response.table.rows || [];
                const eligibleRows = rows.filter(row => isFilledCell(row.c && row.c[0]));
                const total = eligibleRows.length;
                const nominated = eligibleRows.filter(row => getCellValue(row, 1) === true).length;
                const notNominated = Math.max(total - nominated, 0);
                const activeVoteRole = getActiveVoteRole(currentSystemPhase);

                renderNominationChart(nominated, notNominated, total);

                if (activeVoteRole) {
                    const voted = eligibleRows.filter(row => isFilledCell(row.c && row.c[activeVoteRole.index])).length;
                    const votePct = total ? ((voted / total) * 100).toFixed(1) : '0.0';
                    participationMessage.innerHTML = `Sistem kini di fasa <strong>Undian ${activeVoteRole.label}</strong>.<br>${voted}/${total} (${votePct}%) telah mengundi.`;
                } else {
                    participationMessage.textContent = `${nominated} daripada ${total} ahli layak telah membuat pencalonan.`;
                }
            } catch (error) {
                nominationChartElement.setAttribute('aria-label', 'Statistik pencalonan belum dapat dimuatkan.');
                participationMessage.textContent = 'Statistik belum dapat dimuatkan buat masa ini.';
            }
        }

        function loadSheetData(scriptId, sheet, callbackName) {
            const oldScript = document.getElementById(scriptId);
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = scriptId;
            script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${encodeURIComponent(sheet)}&cacheBust=${Date.now()}`;
            script.onerror = () => {
                participationMessage.textContent = 'Ralat sambungan: Statistik tidak dapat dimuatkan.';
            };
            document.body.appendChild(script);
        }

        function loadParticipationStats() {
            loadSheetData('systemPhaseScript', settingsSheetName, 'updateSystemPhase');
            loadSheetData('participationStatsScript', sheetName, 'updateParticipationStats');
        }

        // Muatkan data semasa buka halaman dan ulangi setiap minit
        loadParticipationStats();
        setInterval(loadParticipationStats, 60000);
        
        // Sesuaikan carta apabila skrin berubah saiz
        window.addEventListener('resize', () => nominationChart.resize());
    </script>
</body>
</html>
